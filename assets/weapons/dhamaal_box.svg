<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

    <!-- Base: Battery -->
    <rect x="15" y="40" width="70" height="50" rx="5" fill="#f1c40f"/>
    <rect x="15" y="40" width="70" height="15" fill="#34495e"/>
    <!-- Speaker attached to front -->
    <rect x="25" y="10" width="50" height="60" rx="3" fill="#2c3e50"/>
    <circle cx="50" cy="30" r="15" fill="#7f8c8d" stroke="#e74c3c" stroke-width="3"/>
    <circle cx="50" cy="55" r="10" fill="#7f8c8d" stroke="#e74c3c" stroke-width="2"/>
    <!-- Wiring and Tape -->
    <path d="M 20 40 Q 10 20 25 15" fill="none" stroke="#e74c3c" stroke-width="3"/>
    <rect x="10" y="50" width="80" height="8" fill="#e74c3c" opacity="0.6" transform="rotate(-10 50 50)"/>
    <rect x="10" y="70" width="80" height="8" fill="#e74c3c" opacity="0.6" transform="rotate(5 50 70)"/>

</svg>