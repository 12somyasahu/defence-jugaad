<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

    <!-- Base: Pressure Cooker -->
    <path d="M 20 50 L 80 50 L 75 90 L 25 90 Z" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="3"/>
    <!-- Horn/Speaker attached to whistle -->
    <path d="M 50 50 L 45 20 L 20 10 L 20 40 Z" fill="#2c3e50"/>
    <!-- Funnel / Horn end -->
    <ellipse cx="20" cy="25" rx="5" ry="15" fill="#7f8c8d"/>
    <!-- Tape / Straps -->
    <rect x="40" y="45" width="20" height="10" fill="#c0392b" opacity="0.8"/>
    <!-- Pressure gauge / dial -->
    <circle cx="50" cy="70" r="8" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
    <line x1="50" y1="70" x2="55" y2="65" stroke="#e74c3c" stroke-width="2"/>

</svg>