<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

    <!-- Base: Cycle Wheel -->
    <circle cx="50" cy="70" r="25" fill="none" stroke="#2c3e50" stroke-width="6"/>
    <circle cx="50" cy="70" r="22" fill="none" stroke="#bdc3c7" stroke-width="2"/>
    <!-- Spokes -->
    <line x1="50" y1="45" x2="50" y2="95" stroke="#95a5a6" stroke-width="2"/>
    <line x1="25" y1="70" x2="75" y2="70" stroke="#95a5a6" stroke-width="2"/>
    <!-- Slingshot Mount (Rubber band) -->
    <path d="M 45 70 L 40 20 L 45 20 L 50 50 Z" fill="#8e44ad"/>
    <path d="M 55 70 L 60 20 L 55 20 L 50 50 Z" fill="#8e44ad"/>
    <path d="M 40 20 Q 50 40 60 20" fill="none" stroke="#e67e22" stroke-width="4"/>
    <circle cx="50" cy="30" r="5" fill="#e74c3c"/> <!-- Projectile loaded -->
    <!-- Tape -->
    <rect x="40" y="65" width="20" height="5" fill="#f1c40f" opacity="0.8"/>

</svg>